apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: creative-todo-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: creative-todo-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: creative-todo-api
  template:
    metadata:
      labels:
        app: creative-todo-api
    spec:
      containers:
        - name: api
          image: creative-todo-api:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: ConnectionStrings__TodoDb
              value: Data Source=/app/data/creative-todo.db
          volumeMounts:
            - name: todo-data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 4
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 12
            periodSeconds: 10
      volumes:
        - name: todo-data
          persistentVolumeClaim:
            claimName: creative-todo-data
---
apiVersion: v1
kind: Service
metadata:
  name: creative-todo-api
spec:
  selector:
    app: creative-todo-api
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: creative-todo-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: creative-todo-web
  template:
    metadata:
      labels:
        app: creative-todo-web
    spec:
      containers:
        - name: web
          image: creative-todo-web:local
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: creative-todo-web
spec:
  selector:
    app: creative-todo-web
  ports:
    - port: 80
      targetPort: 80
  type: NodePort
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: creative-todo
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 2m
spec:
  ingressClassName: nginx
  rules:
    - host: creative-todo.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: creative-todo-web
                port:
                  number: 80
